name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens or updates the "Version Packages" PR. Runs dev-dependency code, so it
  # has no id-token.
  version:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version bumps via the API
      pull-requests: write # open the Version Packages PR
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      - name: Create or update version PR
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version

  # Everything that runs dev-dependency code on the way to a release, with no
  # token. A failure here stops the release.
  build:
    name: Build and test
    needs: version
    if: needs.version.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:ci

      - name: Smoke test built package
        run: node scripts/smoke.mts

      - name: Pack
        run: pnpm pack --pack-destination pack

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error

  # Stages the tested tarball. No `pnpm install`: this job holds the id-token
  # and runs no dependency code, only Node and pnpm themselves.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers, and bind the npm
    # trusted publisher to this workflow and environment.
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Staged from outside the checkout so pnpm does not apply this repo's
      # devEngines to the command. The GitHub release is created by hand after
      # approval on npm, because a `v*` tag cannot be removed if this is rejected.
      - name: Stage
        working-directory: ${{ runner.temp }}/pack
        run: pnpm stage publish "./xfcc-parser-$VERSION.tgz" --access public --provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
